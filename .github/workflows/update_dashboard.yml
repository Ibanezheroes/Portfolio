name: Update ETF Dashboard

on:
  schedule:
    - cron: '0 18 * * 1-5' # Runs every weekday at 6:00 PM UTC (after market close)
  workflow_dispatch: # Allows you to trigger it manually anytime from GitHub mobile app or web

jobs:
  build:
  name: Build and Deploy Dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance

      - name: Run Dashboard Generator
        run: |
          python etf_dashboard_google.py --once --output etf_dashboard.html

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_dashboard.html etf_dashboard_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ETF dashboard data [skip ci]" && git push)
